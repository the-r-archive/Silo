<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus shield · Silo</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <main class="card">
    <div class="brand-row">
      <svg class="brand-logo" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="siloMark" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5A42E7"/>
            <stop offset="1" stop-color="#703DEA"/>
          </linearGradient>
        </defs>
        <rect width="48" height="48" rx="10.5" fill="url(#siloMark)"/>
        <path d="M13.6 38.3V20.2a10.4 10.4 0 0 1 20.8 0v18.1a1.4 1.4 0 0 1-1.4 1.4H15a1.4 1.4 0 0 1-1.4-1.4Z" fill="#fff"/>
        <rect x="13.6" y="26.2" width="20.8" height="1.5" fill="#D3D1F8"/>
        <rect x="13.6" y="33" width="20.8" height="1.5" fill="#D3D1F8"/>
        <rect x="10.6" y="39.8" width="26.8" height="1.75" rx=".875" fill="#C5B1F7"/>
        <path d="M23.3 14.7A3.35 3.35 0 1 1 20.65 17.9" fill="none" stroke="#4F46E5" stroke-width="1.55" stroke-linecap="round"/>
        <path d="M20.7 17.3A3.35 3.35 0 0 1 22.75 14.89" fill="none" stroke="#D3D1F8" stroke-width="1.55" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">Silo</span>
    </div>

    <p class="eyebrow">FOCUS SHIELD</p>
    <h1>One step closer<br><em>to your dream.</em></h1>
    <p class="lead"><strong id="siteLabel">This site</strong> is outside your silo.</p>

    <div class="actions">
      <button class="primary" id="stayBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4.5 6v6c0 4.4 3.2 7.6 7.5 9 4.3-1.4 7.5-4.6 7.5-9V6L12 3Z"/><path d="m9 12 2 2 4-4"/></svg>
        Stay focused
      </button>
      <button class="ghost" id="quitToggle" type="button" aria-expanded="false" aria-controls="gate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>
        Leave site
      </button>
    </div>

    <section class="gate" id="gate" hidden>
      <div class="gate-head">
        <span class="gate-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 3 20h18L12 4Z"/><path d="M12 10v4"/><path d="M12 17.2v.1"/></svg>
        </span>
        <p class="gate-title">Turn off your shield?</p>
      </div>
      <p class="phrase">I want to quit my focus</p>
      <form id="quitForm" novalidate>
        <label class="sr-only" for="quitInput">Type the confirmation sentence</label>
        <input id="quitInput" type="text" autocomplete="off" spellcheck="false" placeholder="Type the sentence exactly">
        <p class="gate-error" id="gateError" role="alert"></p>
        <div class="gate-actions">
          <button type="button" class="ghost small" id="cancelQuit">Stay focused</button>
          <button type="submit" class="danger" id="confirmQuit">Turn off shield</button>
        </div>
      </form>
    </section>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
